name: Rebase patched master onto upstream

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/merbanan/rtl_433.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase master onto upstream
        run: |
          git checkout master
          git rebase upstream/master

      - name: Push rebased master
        run: git push origin master --force-with-lease
